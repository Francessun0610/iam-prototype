<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — User Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Global Navigation Bar -->
  <nav class="global-nav">
    <div class="nav-left">
      <div class="nav-logo">
        <svg class="disney-logo" viewBox="0 0 145 27" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="0" y="20" fill="white" font-size="16" font-weight="bold" font-family="serif" letter-spacing="1">
            <tspan font-style="italic" font-size="20">Disney</tspan>
            <tspan dx="4" font-size="14" font-weight="400">Advertising</tspan>
          </text>
        </svg>
      </div>
      <div class="nav-items">
        <a href="#" class="nav-item">Sales</a>
        <a href="#" class="nav-item has-dropdown">
          Planning
          <svg class="chevron-down" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 6L8 10L12 6" stroke="#E6E6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="#" class="nav-item has-dropdown">
          Ad Ops
          <svg class="chevron-down" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 6L8 10L12 6" stroke="#E6E6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="#" class="nav-item has-dropdown">
          Billing
          <svg class="chevron-down" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 6L8 10L12 6" stroke="#E6E6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="#" class="nav-item active has-dropdown">
          Admin
          <svg class="chevron-down" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 6L8 10L12 6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
    <div class="nav-right">
      <button class="nav-icon-btn" aria-label="Notifications">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="#E6E6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="#E6E6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="nav-avatar-btn" aria-label="User menu">
        <div class="avatar-circle"></div>
      </button>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="page-content">
    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">User Management</h1>
      <p class="page-subtitle">Assign roles and manage access across Atlas</p>
    </div>

    <!-- Card Container -->
    <div class="card">
      <!-- Tabs -->
      <div class="tabs-bar">
        <div class="tabs">
          <button class="tab active">Users (610 total)</button>
          <button class="tab">Roles and Permissions</button>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-buttons">
            <button class="btn-outline">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3611C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
              </svg>
              Filter
            </button>
            <button class="btn-outline">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3611C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="18" rx="1"/>
                <rect x="14" y="3" width="7" height="18" rx="1"/>
              </svg>
              Columns
            </button>
          </div>
          <div class="search-field">
            <input type="text" placeholder="Search by name, email, or role" />
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9EB0BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
        </div>
        <button class="btn-add-users">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3611C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Add Users
        </button>
      </div>

      <!-- Data Table -->
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th class="col-checkbox">
                <label class="checkbox-wrapper">
                  <input type="checkbox" id="selectAll" />
                  <span class="checkbox-custom"></span>
                </label>
              </th>
              <th class="col-name">
                <span class="header-text">Name</span>
                <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8498A9" stroke-width="2"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
              </th>
              <th class="col-email">
                <span class="header-text">Email</span>
                <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8498A9" stroke-width="2"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
              </th>
              <th class="col-role">
                <span class="header-text">Role</span>
                <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8498A9" stroke-width="2"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
              </th>
              <th class="col-status">
                <span class="header-text">Status</span>
                <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8498A9" stroke-width="2"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
              </th>
              <th class="col-team">
                <span class="header-text">Team</span>
                <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8498A9" stroke-width="2"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
              </th>
              <th class="col-company">
                <span class="header-text">Company Title/ Role</span>
                <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8498A9" stroke-width="2"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
              </th>
              <th class="col-region">
                <span class="header-text">Region</span>
                <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8498A9" stroke-width="2"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
              </th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination-bar">
        <div class="pagination-show">
          <span class="pagination-label">Show</span>
          <div class="pagination-select-wrapper">
            <select class="pagination-select" id="rowsPerPage">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>
            <svg class="select-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none">
              <path d="M4 6L8 10L12 6" stroke="#9AABBB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="pagination-label">of 610 items</span>
        </div>
        <div class="pagination-pages">
          <button class="page-nav disabled" aria-label="First page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
          </button>
          <button class="page-nav disabled" aria-label="Previous page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="page-numbers">
            <button class="page-number active">1</button>
            <button class="page-number">2</button>
            <button class="page-number">3</button>
            <span class="page-ellipsis">...</span>
            <button class="page-number">10</button>
          </div>
          <button class="page-nav" aria-label="Next page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="page-nav" aria-label="Last page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
          </button>
        </div>
        <div class="pagination-jumper">
          <span class="pagination-label">Go to page</span>
          <div class="pagination-select-wrapper">
            <select class="pagination-select" id="pageJumper">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
            <svg class="select-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none">
              <path d="M4 6L8 10L12 6" stroke="#9AABBB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
